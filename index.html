<!DOCTYPE html>
<html>
    <head>
        <title>Product Manager</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="app">
        <h1 id="title">Product Manager</h1>

        <p class="subtitle">Manage your products using JavaScript and Local Storage</p>

    <div class="form-box">
        <input type="text" id="productName" placeholder="Product Name">

        <input type="number" id="productPrice" placeholder="Product price">

        <input type="number" id="productQuantity" placeholder="Product Quantity">

        <button id="saveBtn">Save Product</button>

        <p id="message"></p>
    </div>

    <div class="list.box">
        <h2>Products</h2>

     <div id="productList"></div>
    </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
